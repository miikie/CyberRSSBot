database: cyberrssbot.db

discord:
  guild_id: 0
  channels:
    default: 0
    kev: 0
    vulns: 0
    advisories: 0
    news: 0
    research: 0
    dfir: 0
    breaches: 0
    ransomware: 0
    malware: 0
    finance: 0
    # Windows security update cards (msrc_cvrf source). 0 falls back to `default`.
    microsoft: 0
    # Scheduled intelligence digests (see `digest:` below). 0 = digests are built but not posted.
    digest: 0
    # Optional extra channels for label routing (see `routing:` below). Only used by an enabled route.
    apt-tracker: 0
    malware-radar: 0
    supply-chain: 0
    data-privacy-laws: 0
    log: 0
  kev_ping_role_id: 0
  # Role mentioned on each new Windows update card. 0 = no ping. Checked at startup;
  # a role that doesn't exist is logged as a warning and never mentioned.
  microsoft_ping_role_id: 0
  post_gap_seconds: 1.5

poll:
  default_interval: 1200
  max_age_days: 7
  first_run_lookback_hours: 0

network:
  timeout: 45
  user_agent: "Mozilla/5.0 (compatible; CyberRSSBot/1.0; +security news aggregator)"
  host_min_interval_default: 2.0
  host_min_interval:
    services.nvd.nist.gov: 6.5
    api.github.com: 2.0
    api.first.org: 2.0
    data.sec.gov: 0.25
    finnhub.io: 1.1

dedup:
  story_window_hours: 72
  title_threshold: 0.5
  cve_title_threshold: 0.25
  fold_cve_news: false

filters:
  vulns:
    min_cvss: 8.0
    min_epss: 0.10
    watch_min_cvss: 6.5
    max_age_days: 30
    watchlist: [microsoft, windows, exchange, sharepoint, azure, microsoft edge, cisco, fortinet, fortios,
                fortigate, fortiweb, ivanti, citrix, netscaler, palo alto, pan-os, globalprotect,
                vmware, esxi, vcenter, f5, big-ip, sonicwall, juniper, check point, atlassian,
                confluence, jira, gitlab, jenkins, openssh, openssl, chrome, chromium, firefox,
                apple, ios, macos, android, veeam, zyxel, sap, oracle, kubernetes, docker, okta]
    mute_cnas: [vuldb, wordfence, patchstack, wpscan]
    mute_patterns: ["plugin for wordpress", "wordpress plugin", "theme for wordpress",
                    "sourcecodester", "phpgurukul", "code-projects", "itsourcecode", "campcodes"]

finance:
  sec_contact_name: CyberRSSBot
  move_alert_pct: 7
  summary_delay_minutes: 20
  cluster_window_hours: 48
  filings: {form4: false, schedule_13g: false}
  earnings: {weekly_weekday: 0, weekly_hour_utc: 13, same_day_reminder: true, reminder_hour_et: 8,
             refresh_hours: 12, horizon_days: 90}
  companies:
    CRWD: {name: CrowdStrike, cik: 1535527}
    PANW: {name: Palo Alto Networks, cik: 1327567}
    FTNT: {name: Fortinet, cik: 1262039}
    ZS:   {name: Zscaler, cik: 1713683}
    S:    {name: SentinelOne, cik: 1583708}
    OKTA: {name: Okta, cik: 1660134}
    NET:  {name: Cloudflare, cik: 1477333}
    CHKP: {name: Check Point Software, cik: 1015922, aliases: [Check Point]}
    QLYS: {name: Qualys, cik: 1107843}
    TENB: {name: Tenable, cik: 1660280}
    RPD:  {name: Rapid7, cik: 1560327}
    VRNS: {name: Varonis, cik: 1361113}
    RBRK: {name: Rubrik, cik: 1943896}
    SAIL: {name: SailPoint, cik: 2030781}
    GEN:  {name: Gen Digital, cik: 849399}
    AKAM: {name: Akamai, cik: 1086222}
    FFIV: {name: F5, cik: 1048695, aliases: [F5 Networks]}
  benchmarks:
    CIBR: First Trust NASDAQ Cybersecurity ETF
    HACK: Amplify Cybersecurity ETF
    BUG: Global X Cybersecurity ETF

# Reference data for entity extraction: MITRE ATT&CK groups and software, MISP galaxy threat actors and the
# CISA KEV vendor/product list, plus the manual lists in `extras_dir`.
kb:
  # Where the downloaded gazetteers are cached. The bot works offline from this cache if a refresh fails.
  cache_dir: kb_cache
  # Folder with the manual lists: actors.yaml, ransomware.yaml, regulators.yaml, countries.yaml, and
  # common_words.txt (names that are also ordinary words and so need exact case plus a cue word).
  extras_dir: kb
  # Days between downloads of ATT&CK and the MISP actor list.
  refresh_days: 7
  # false = use ATT&CK only for threat actors.
  use_misp: true

# Label routing. Each key is a channel under discord.channels; a new story or CVE carrying one of the labels
# is posted there instead of its source's usual channel (first matching route wins, so an item is still
# posted exactly once). Labels: exploited, vulnerability, ransomware, breach, apt, malware, supply-chain,
# policy-law, law-enforcement, finance. KEV posts and finance posts are never rerouted.
routing:
  apt-tracker:       {labels: [apt], enabled: false}
  malware-radar:     {labels: [malware], enabled: false}
  supply-chain:      {labels: [supply-chain], enabled: false}
  data-privacy-laws: {labels: [policy-law], enabled: false}

digest:
  # true = post the scheduled editions below to the `channel`. /digest works either way.
  enabled: false
  # Key under discord.channels that digests are posted to.
  channel: digest
  # Editions. Each one is built at the listed UTC times and covers the `hours` before that time.
  editions:
    - {name: 6h, hours: 6, at_utc: ["00:00", "06:00", "12:00", "18:00"]}
    - {name: daily, hours: 24, at_utc: ["06:00"]}
  # A scheduled edition missed by more than this many minutes (bot was down) is skipped, not posted late.
  catch_up_minutes: 90
  # Post an edition even when no section has items (it then only carries the coverage section).
  post_empty: true
  # Items shown per section. A section can override it with `top:`.
  top_n: 5
  # Items scoring below this are left out.
  min_score: 0
  # Longest quoted sentence, in words. One sentence per item, always attributed and linked.
  max_words: 40
  # An item first seen in the window is dropped if its publication date is more than this many hours
  # before the window start, or after the window end.
  late_grace_hours: 6
  # Messages are split at section boundaries to stay under this size (Discord's embed limit is 4096).
  max_message_chars: 3800
  # How far back /entity looks for items mentioning an entity.
  entity_lookback_days: 14
  # Sections in display order. `labels` are the topic labels a section collects. Empty sections are
  # left out and listed under "Coverage & limitations".
  sections:
    - {key: exploited,       title: Exploited in the wild,     labels: [exploited]}
    - {key: vulnerabilities, title: Vulnerabilities & patches, labels: [vulnerability]}
    - {key: breaches,        title: Breaches & ransomware,     labels: [breach, ransomware]}
    - {key: actors,          title: Threat actors,             labels: [apt]}
    - {key: malware,         title: Malware,                   labels: [malware]}
    - {key: supply-chain,    title: Supply chain,              labels: [supply-chain]}
    - {key: law-enforcement, title: Law enforcement,           labels: [law-enforcement]}
    - {key: policy,          title: Policy & law,              labels: [policy-law]}
    - {key: markets,         title: Markets,                   labels: [finance]}
  # An item with several labels appears once, in the section of its highest-priority label.
  label_priority: [exploited, law-enforcement, policy-law, supply-chain, apt, malware, ransomware, breach,
                   vulnerability, finance]
  # Signal score = (base + bonuses) x recency decay.
  weights:
    base: 1.0
    # Per additional outlet covering the same story, up to outlet_cap outlets.
    outlet: 1.0
    outlet_cap: 5
    # The CVE is in CISA KEV.
    kev: 5.0
    # Scaled by CVSS: a 10.0 adds the full weight.
    cvss: 3.0
    # Mentions a term on filters.vulns.watchlist.
    watchlist: 1.5
    # Names a known threat actor or malware family.
    named: 1.5
    # Contains a money amount or a victim / record / device count.
    figures: 1.0
    # Comes from a source marked `primary: true` (vendor, agency, CERT), or is a CVE record or SEC filing.
    primary: 2.0
    # The score halves every this many hours of age, measured from the end of the window. 0 = no decay.
    half_life_hours: 24

sources:
  - {id: cisa-kev, type: kev,  name: CISA KEV,      channel: kev,   interval: 1800}
  - {id: nvd,      type: nvd,  name: NVD,           channel: vulns, interval: 900, first_run_lookback_hours: 6}
  - {id: ghsa,     type: ghsa, name: GitHub Advisory, channel: vulns, interval: 1800}
  - {id: epss,     type: epss, name: FIRST EPSS,    interval: 21600, track_days: 14}
  - id: msrc
    name: MSRC
    type: rss
    kind: vuln
    vendor: microsoft
    url: https://api.msrc.microsoft.com/update-guide/rss
    interval: 1800

  # Microsoft security updates: one card per Windows KB, with a TSV of the CVEs it fixes.
  - id: msrc-kb
    type: msrc_cvrf
    name: Microsoft security updates
    # Key under discord.channels that the cards, revision lines and Patch Tuesday summary go to.
    channel: microsoft
    # Seconds between polls of the MSRC updates index on a normal day (3 hours).
    interval: 10800
    # Seconds between polls on Patch Tuesday and the day after (US Pacific time).
    patch_tuesday_interval: 1800
    # How many of the newest monthly release documents to watch for new KBs and revisions.
    months: 2
    # Product allowlist. A KB gets a card only if it applies to a product whose MSRC name starts with
    # one of these (case-insensitive). Add e.g. "Windows Server 2016" or "Microsoft Office 2016".
    products:
      - Windows 11
      - Windows 10
      - Windows Server 2019
      - Windows Server 2022
      - Windows Server 2025

  - {id: cisa-advisories, primary: true, name: CISA, channel: advisories, interval: 1800, enabled: false,
     url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"}
  - {id: cert-eu, primary: true, name: CERT-EU, channel: advisories, interval: 3600,
     url: "https://cert.europa.eu/publications/security-advisories-rss"}
  - {id: ncsc-uk, primary: true, name: NCSC UK, channel: advisories, interval: 3600,
     url: "https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml"}
  - {id: cccs, primary: true, name: Canadian Centre for Cyber Security, channel: advisories, interval: 3600,
     url: "https://www.cyber.gc.ca/api/cccs/rss/v1/get?feed=alerts_advisories&lang=en"}

  - {id: cisco-psirt, primary: true, name: Cisco PSIRT, channel: advisories, interval: 3600,
     url: "https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml"}
  - {id: fortinet-psirt, primary: true, name: Fortinet PSIRT, channel: advisories, interval: 3600,
     url: "https://filestore.fortinet.com/fortiguard/rss/ir.xml"}
  - {id: paloalto-psirt, primary: true, name: Palo Alto Networks, channel: advisories, interval: 3600,
     url: "https://security.paloaltonetworks.com/rss.xml"}

  # Law-enforcement press releases. `labels: [law-enforcement]` adds that topic label to every item from the source;
  # `primary: true` marks a first-hand source for the digest score. DOJ, FBI and the NCA publish every
  # press release in one feed, so include_keywords keeps only the cyber-related ones.
  - {id: doj, name: US Department of Justice, channel: news, interval: 1800, primary: true, labels: [law-enforcement],
     url: "https://www.justice.gov/news/rss?type=press_release&m=1",
     include_keywords: &cyberwords ["cyber", "ransomware", "malware", "hack", "botnet", "darknet", "dark web", "phishing", "data breach", "computer fraud", "computer intrusion", "spyware", "ddos", "cryptocurrency", "trade secrets", "export-controlled"]}
  - {id: europol, name: Europol, channel: news, interval: 3600, primary: true, labels: [law-enforcement],
     url: "https://www.europol.europa.eu/cms/api/rss/news", include_keywords: *cyberwords}
  - {id: fbi, name: FBI, channel: news, interval: 3600, primary: true, labels: [law-enforcement], enabled: false,
     url: "https://www.fbi.gov/feeds/national-press-releases/rss.xml", include_keywords: *cyberwords}
  - {id: nca-uk, name: UK National Crime Agency, channel: news, interval: 3600, primary: true,
     labels: [law-enforcement], enabled: false,
     url: "https://www.nationalcrimeagency.gov.uk/news?format=feed&type=rss", include_keywords: *cyberwords}

  - {id: bleepingcomputer, name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/"}
  - {id: thehackernews,    name: The Hacker News,  url: "https://feeds.feedburner.com/TheHackersNews"}
  - {id: therecord,        name: The Record,       url: "https://therecord.media/feed"}
  - {id: securityweek,     name: SecurityWeek,     url: "https://www.securityweek.com/feed/"}
  - {id: krebs,            name: Krebs on Security, url: "https://krebsonsecurity.com/feed/", interval: 3600}
  - {id: darkreading,      name: Dark Reading,     url: "https://www.darkreading.com/rss.xml",
     exclude_keywords: ["[virtual event]", "[webinar]"]}
  - {id: cyberscoop,       name: CyberScoop,       url: "https://cyberscoop.com/feed/"}
  - {id: ars-security,     name: Ars Technica,     url: "https://arstechnica.com/security/feed/"}
  - {id: theregister-sec,  name: The Register,     url: "https://www.theregister.com/security/headlines.atom"}
  - {id: schneier,         name: Schneier on Security, url: "https://www.schneier.com/feed/atom/", interval: 3600}

  - {id: talos, primary: true,      name: Cisco Talos,     channel: research, interval: 3600, url: "https://blog.talosintelligence.com/rss/"}
  - {id: eset, primary: true,       name: ESET Research,   channel: research, interval: 3600, url: "https://www.welivesecurity.com/en/rss/feed/"}
  - {id: unit42, primary: true,     name: Unit 42,         channel: research, interval: 3600, url: "https://unit42.paloaltonetworks.com/feed/"}
  - {id: msft-sec, primary: true,   name: Microsoft Security, channel: research, interval: 3600, url: "https://www.microsoft.com/en-us/security/blog/feed/"}
  - {id: gtig, primary: true,       name: Google Threat Intelligence, channel: research, interval: 3600,
     url: "https://cloudblog.withgoogle.com/topics/threat-intelligence/rss/"}
  - {id: securelist, primary: true, name: Kaspersky Securelist, channel: research, interval: 3600, url: "https://securelist.com/feed/"}
  - {id: checkpoint, primary: true, name: Check Point Research, channel: research, interval: 3600, url: "https://research.checkpoint.com/feed/"}
  - {id: sophos, primary: true,     name: Sophos X-Ops,    channel: research, interval: 3600,
     url: "https://news.sophos.com/en-us/category/threat-research/feed/"}
  - {id: dfir-report, primary: true, name: The DFIR Report, channel: dfir, interval: 7200, url: "https://thedfirreport.com/feed/"}
  - {id: watchtowr, primary: true,  name: watchTowr Labs,  channel: research, interval: 7200, url: "https://labs.watchtowr.com/rss/"}
  - {id: sans-isc, primary: true,   name: SANS ISC,        channel: dfir, interval: 3600, url: "https://isc.sans.edu/rssfeed_full.xml"}
  - {id: exploit-db, name: Exploit-DB,      channel: research, interval: 3600, url: "https://www.exploit-db.com/rss.xml"}

  - {id: databreaches, name: DataBreaches.net, channel: breaches, url: "https://databreaches.net/feed/"}
  - {id: hibp,         name: Have I Been Pwned, channel: breaches, interval: 3600,
     url: "https://feeds.feedburner.com/HaveIBeenPwnedLatestBreaches"}

  - {id: ransomware-live, name: ransomware.live, channel: ransomware, interval: 1800, cluster: false,
     labels: [ransomware],
     url: "https://www.ransomware.live/rss.xml"}

  - {id: anyrun,          name: ANY.RUN,          channel: malware, interval: 3600, url: "https://any.run/cybersecurity-blog/feed/"}
  - {id: malware-traffic, name: Malware Traffic Analysis, channel: malware, interval: 7200,
     url: "https://www.malware-traffic-analysis.net/blog-entries.rss"}
  - {id: malpedia,        name: Malpedia,         channel: malware, interval: 7200,
     url: "https://malpedia.caad.fkie.fraunhofer.de/feeds/rss/latest"}
  - {id: malwarebytes,    name: Malwarebytes Labs, channel: malware, interval: 3600,
     url: "https://www.malwarebytes.com/blog/feed/index.xml"}

  - {id: sec-edgar,    type: sec_edgar,    name: SEC EDGAR,         channel: finance, interval: 600, idle_interval: 3600}
  - {id: fin-quotes,   type: quotes,       name: Finnhub quotes,    channel: finance, interval: 900}
  - {id: fin-earnings, type: earnings,     name: Finnhub earnings,  channel: finance, interval: 1800}
  - {id: fin-news,     type: company_news, name: Finnhub news,      channel: finance, interval: 3600, enabled: false}
  - {id: ir-cloudflare, name: Cloudflare IR, channel: finance, tickers: [NET], interval: 3600,
     url: "https://cloudflare.net/rss/pressrelease.aspx"}
  - {id: ir-gen, name: Gen Digital IR, channel: finance, tickers: [GEN], interval: 3600,
     url: "https://investor.gendigital.com/rss/pressrelease.aspx"}
  - {id: gnw-rapid7, name: GlobeNewswire, channel: finance, tickers: [RPD], interval: 3600,
     url: "https://www.globenewswire.com/RssFeed/keyword/Rapid7",
     exclude_keywords: &lawfirms ["law firm", "law llp", "class action", "shareholder alert", "investor alert",
                                  "securities fraud", "lawsuit", "encourages investors", "investors who",
                                  "rosen law", "pomerantz", "levi & korsinsky", "bragar", "faruqi",
                                  "kessler topaz", "hagens berman", "kuehn law", "robbins geller"]}
  - {id: gnw-akamai, name: GlobeNewswire, channel: finance, tickers: [AKAM], interval: 3600,
     url: "https://www.globenewswire.com/RssFeed/keyword/Akamai", exclude_keywords: *lawfirms}
  - {id: gnw-tenable, name: GlobeNewswire, channel: finance, tickers: [TENB], interval: 3600,
     url: "https://www.globenewswire.com/RssFeed/keyword/Tenable", exclude_keywords: *lawfirms}
  - {id: gnw-rubrik, name: GlobeNewswire, channel: finance, tickers: [RBRK], interval: 3600,
     url: "https://www.globenewswire.com/RssFeed/keyword/Rubrik", exclude_keywords: *lawfirms}
  - {id: gnw-qualys, name: GlobeNewswire, channel: finance, tickers: [QLYS], interval: 3600,
     url: "https://www.globenewswire.com/RssFeed/keyword/Qualys", exclude_keywords: *lawfirms}
